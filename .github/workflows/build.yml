name: Build fonts

on:
  push:
    branches: [main, develop]
    tags: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nicoverbruggen/fntbld-oci:latest

    steps:
      - uses: actions/checkout@v5

      - name: Build fonts
        run: python3 build.py --with-kobofix

      - name: Validate generated fonts with ots-sanitize
        run: |
          for font in out/ttf/*.ttf out/kf/*.ttf out/web/*.woff2; do
            echo "Validating ${font}"
            ots-sanitize "${font}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Libron
          path: out/ttf/*.ttf

      - name: Upload Kobo artifact
        uses: actions/upload-artifact@v6
        with:
          name: KF_Libron
          path: out/kf/*.ttf

      - name: Upload Web artifact
        uses: actions/upload-artifact@v6
        with:
          name: Libron_Web
          path: out/web/*.woff2

      - name: Zip fonts for release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd out/ttf && zip -j ../../Libron.zip *.ttf
          cd ../../out/kf && zip -j ../../KF_Libron.zip *.ttf
          cd ../../out/web && zip -j ../../Libron_Web.zip *.woff2

      - name: Upload release zips
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: Libron-release
          path: |
            Libron.zip
            KF_Libron.zip
            Libron_Web.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v6
        with:
          name: Libron-release

      - name: Assemble release notes
        run: |
          {
            echo 'RELEASE_BODY<<__RELEASE_EOF__'
            # Notes under the first "## " heading in CHANGELOG.md.
            awk 'f && /^## /{exit} /^## /{f=1; next} f{print}' CHANGELOG.md
            cat <<'EOF'

          > [!TIP]
          > **If you are using a Kobo device and reading books purchased from the Kobo Store or reading `kepub` files converted via Calibre**, you should download KF_Libron.zip, which has fonts processed via `kobo-font-fix` for improved compatibility on Kobo devices.

          ### Learn more

          Libron is a modified version of Readerly with reduced serifs. For more information about the font and how it was built, please consult the repository README.
          EOF
            echo '__RELEASE_EOF__'
          } >> "$GITHUB_ENV"

      - name: Determine pre-release
        run: |
          # Pre-release unless this tag's commit is reachable from main.
          if git fetch --no-tags --quiet origin main 2>/dev/null \
             && git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ env.PRERELEASE }}
          name: ${{ github.ref_name }}
          body: ${{ env.RELEASE_BODY }}
          files: |
            Libron.zip
            KF_Libron.zip
            Libron_Web.zip
