name: Release

on:
  push:
    tags: ["*"]

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nicoverbruggen/fntbld-oci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build fonts
        run: python3 build.py --with-kobofix --without-web

      - name: Validate generated fonts with ots-sanitize
        run: |
          for font in out/ttf/*.ttf out/kf/*.ttf out/relaxed/*.ttf; do
            echo "Validating ${font}"
            ots-sanitize "${font}"
          done

      - name: Create zip files
        if: startsWith(gitea.ref, 'refs/tags/')
        run: |
          cd out/ttf && zip -j /tmp/Libron.zip *.ttf
          cd $GITHUB_WORKSPACE/out/kf  && zip -j /tmp/KF_Libron.zip *.ttf
          cd $GITHUB_WORKSPACE/out/relaxed && zip -j /tmp/Libron_R.zip *.ttf

      - name: Assemble release notes
        if: startsWith(gitea.ref, 'refs/tags/')
        run: |
          {
            echo 'RELEASE_BODY<<__RELEASE_EOF__'
            # Notes under the first "## " heading in CHANGELOG.md.
            awk 'f && /^## /{exit} /^## /{f=1; next} f{print}' CHANGELOG.md
            cat <<'EOF'

          ### Downloads

          - [Libron.zip](${{ gitea.server_url }}/${{ gitea.repository }}/releases/download/${{ gitea.ref_name }}/Libron.zip): standard fonts for e-readers and desktop use.
          - [KF_Libron.zip](${{ gitea.server_url }}/${{ gitea.repository }}/releases/download/${{ gitea.ref_name }}/KF_Libron.zip): Kobo fonts processed with `kobo-font-fix`.
          - [Libron_R.zip](${{ gitea.server_url }}/${{ gitea.repository }}/releases/download/${{ gitea.ref_name }}/Libron_R.zip): `Libron R` with 35% extra line spacing.

          CrossPoint and web fonts are available from the [GitHub releases](https://github.com/nicoverbruggen/libron/releases).

          See the [README](${{ gitea.server_url }}/${{ gitea.repository }}/src/branch/main/README.md) for installation details. Libron uses the [SIL Open Font License](${{ gitea.server_url }}/${{ gitea.repository }}/src/branch/main/LICENSE).
          EOF
            echo '__RELEASE_EOF__'
          } >> "$GITHUB_ENV"

      - name: Determine pre-release
        if: startsWith(gitea.ref, 'refs/tags/')
        run: |
          # Pre-release unless this tag's commit is reachable from main.
          if git fetch --no-tags --quiet origin main 2>/dev/null \
             && git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Create release
        if: startsWith(gitea.ref, 'refs/tags/')
        uses: akkuman/gitea-release-action@v1
        with:
          token: ${{ secrets.GITEA_TOKEN }}
          draft: false
          prerelease: ${{ env.PRERELEASE }}
          tag_name: ${{ gitea.ref_name }}
          name: Libron (${{ gitea.ref_name }})
          body: ${{ env.RELEASE_BODY }}
          files: |
            /tmp/Libron.zip
            /tmp/KF_Libron.zip
            /tmp/Libron_R.zip
