name: Release

on:
  push:
    tags: ["*"]

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nicoverbruggen/fntbld-oci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build fonts
        run: python3 build.py --with-kobofix

      - name: Validate generated fonts with ots-sanitize
        run: |
          for font in out/ttf/*.ttf out/kf/*.ttf out/web/*.woff2; do
            echo "Validating ${font}"
            ots-sanitize "${font}"
          done

      - name: Create zip files
        if: startsWith(gitea.ref, 'refs/tags/')
        run: |
          cd out/ttf && zip -j /tmp/Libron.zip *.ttf
          cd $GITHUB_WORKSPACE/out/kf  && zip -j /tmp/KF_Libron.zip *.ttf
          cd $GITHUB_WORKSPACE/out/web && zip -j /tmp/Libron_Web.zip *.woff2

      - name: Assemble release notes
        if: startsWith(gitea.ref, 'refs/tags/')
        run: |
          {
            echo 'RELEASE_BODY<<__RELEASE_EOF__'
            # Notes under the first "## " heading in CHANGELOG.md.
            awk 'f && /^## /{exit} /^## /{f=1; next} f{print}' CHANGELOG.md
            cat <<'EOF'

          ### Downloads

          - **If you are using a Kobo device**, download [KF_Libron.zip](${{ gitea.server_url }}/${{ gitea.repository }}/releases/download/${{ gitea.ref_name }}/KF_Libron.zip). It has been processed with `kobo-font-fix` for improved compatibility with Kobo's `kepub` renderer.
          - **If you are using a Kindle, another e-reader or a desktop computer**, download [Libron.zip](${{ gitea.server_url }}/${{ gitea.repository }}/releases/download/${{ gitea.ref_name }}/Libron.zip).
          - **If you are using CrossPoint Reader**, Libron for the Xteink X3 and X4 devices is published as `cpfont` files in [ebook-fonts](https://github.com/nicoverbruggen/ebook-fonts).
          - **If you want to use Libron on a website**, download [Libron_Web.zip](${{ gitea.server_url }}/${{ gitea.repository }}/releases/download/${{ gitea.ref_name }}/Libron_Web.zip).

          ### Learn more

          Libron is a modified version of Readerly with a calmer, more neutral appearance intended for reading books. For more information about the font and how it was built, please consult the [README](${{ gitea.server_url }}/${{ gitea.repository }}/src/branch/main/README.md).

          ### License

          Libron is available under the [SIL Open Font License](${{ gitea.server_url }}/${{ gitea.repository }}/src/branch/main/LICENSE) and may be embedded in digital books.
          EOF
            echo '__RELEASE_EOF__'
          } >> "$GITHUB_ENV"

      - name: Determine pre-release
        if: startsWith(gitea.ref, 'refs/tags/')
        run: |
          # Pre-release unless this tag's commit is reachable from main.
          if git fetch --no-tags --quiet origin main 2>/dev/null \
             && git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Create release
        if: startsWith(gitea.ref, 'refs/tags/')
        uses: akkuman/gitea-release-action@v1
        with:
          token: ${{ secrets.GITEA_TOKEN }}
          draft: false
          prerelease: ${{ env.PRERELEASE }}
          tag_name: ${{ gitea.ref_name }}
          name: Libron (${{ gitea.ref_name }})
          body: ${{ env.RELEASE_BODY }}
          files: |
            /tmp/Libron.zip
            /tmp/KF_Libron.zip
            /tmp/Libron_Web.zip
